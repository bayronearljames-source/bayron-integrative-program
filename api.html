<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>University Search App</title>

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0099ff, #acb6e5);
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 850px;
        margin: 50px auto;
        padding: 30px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      }

      h1 {
        text-align: center;
        color: #2c3e50;
      }

      p {
        text-align: center;
        color: #555;
      }

      .search-box {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
        flex-wrap: wrap;
      }

      input {
        padding: 12px;
        border-radius: 8px;
        border: none;
        width: 250px;
        outline: none;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
      }

      button {
        padding: 12px 18px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #2980b9, #6dd5fa);
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      }

      .save-btn {
        margin-top: 10px;
        background: linear-gradient(135deg, #003f91, #003f91);
      }

      /* ✅ DONE BUTTON STYLE */
      .done-btn {
        margin-top: 10px;
        background: linear-gradient(135deg, #95a5a6, #bdc3c7);
        cursor: default;
      }

      .saved-link {
        text-align: center;
        margin-bottom: 15px;
      }

      .saved-link a {
        text-decoration: none;
        font-weight: bold;
        color: #2c3e50;
      }

      #result ul {
        padding: 0;
      }

      #result li {
        list-style: none;
        margin: 15px 0;
        padding: 20px;
        border-radius: 12px;
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      strong {
        font-size: 1.2em;
        color: #2c3e50;
      }

      a {
        color: #2980b9;
        text-decoration: none;
      }

      .error {
        color: red;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🎓 University Search</h1>
      <p>Find and save universities</p>

      <div class="search-box">
        <input type="text" id="countryInput" placeholder="e.g. Philippines" />
        <button onclick="getUniversities()">Search</button>
      </div>

      <div class="saved-link">
        <a href="saved.html">📂 View Saved Universities</a>
      </div>

      <div id="result"></div>
    </div>

    <script>
      async function getUniversities() {
        const country = document.getElementById("countryInput").value.trim();
        const resultDiv = document.getElementById("result");

        if (!country) {
          resultDiv.innerHTML =
            "<p class='error'>⚠️ Please enter a country.</p>";
          return;
        }

        const url = `http://universities.hipolabs.com/search?country=${country}`;

        try {
          resultDiv.innerHTML = "<p>🔎 Searching...</p>";

          const response = await fetch(url);
          const data = await response.json();

          if (data.length === 0) {
            resultDiv.innerHTML = "<p class='error'>No universities found.</p>";
            return;
          }

          let list = "<ul>";

          data.forEach((uni) => {
            const saved = isSaved(uni.name);

            list += `
        <li>
          <strong>${uni.name}</strong><br>
          <a href="${uni.web_pages[0]}" target="_blank">${uni.web_pages[0]}</a><br>

          ${
            saved
              ? `<button class="done-btn" disabled>✅ Done</button>`
              : `<button class="save-btn" onclick='saveUniversity(${JSON.stringify(uni)})'>
                  💾 Save
                </button>`
          }
        </li>
      `;
          });

          list += "</ul>";
          resultDiv.innerHTML = list;
        } catch {
          resultDiv.innerHTML = "<p class='error'>Error loading data</p>";
        }
      }

      /* ✅ CHECK IF SAVED */
      function isSaved(name) {
        const saved =
          JSON.parse(localStorage.getItem("savedUniversities")) || [];
        return saved.some((item) => item.name === name);
      }

      /* ✅ SAVE FUNCTION */
      function saveUniversity(uni) {
        let saved = JSON.parse(localStorage.getItem("savedUniversities")) || [];

        const exists = saved.some((item) => item.name === uni.name);

        if (exists) {
          alert("⚠️ Already saved!");
          return;
        }

        saved.push({
          name: uni.name,
          website: uni.web_pages[0],
        });

        localStorage.setItem("savedUniversities", JSON.stringify(saved));

        alert("✅ Saved!");

        // 🔥 Refresh UI
        getUniversities();
      }
    </script>
  </body>
</html>
