<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | EJ SpeedZone Motorparts</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Optional: set a small favicon -->
    <!-- <link rel="icon" href="images/favicon.png" type="image/png" /> -->
  </head>

  <body>
    <section class="auth-page">
      <div class="auth-card">
        <h2>Create Account</h2>
        <p class="auth-text">Join EJ SpeedZone Motorparts today</p>

        <form id="signupForm" novalidate>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Full Name"
            required
          />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email Address"
            required
          />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm Password"
            required
          />
          <button type="submit" class="auth-btn">Sign Up</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Log In</a>
        </p>
        <a href="index.html" class="back-link">← Back to Home</a>
      </div>
    </section>

    <!-- Form validation script (optional, match your script.js style) -->
    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (password !== confirmPassword) {
            alert("Passwords do not match. Please try again.");
            return;
          }

          // For now: success feedback
          alert("Account created successfully! You can now log in.");
          this.reset();
        });
    </script>
  </body>
</html>
