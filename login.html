<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | EJ SpeedZone Motorparts</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="auth-page">
      <div class="auth-card">
        <h2>Log In</h2>
        <p class="auth-text">Welcome back to EJ SpeedZone Motorparts</p>

        <form id="loginForm" novalidate>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="Email Address"
            required
          />
          <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Password"
            required
          />
          <button type="submit" class="auth-btn">Log In</button>
        </form>

        <p class="auth-switch">
          Don’t have an account? <a href="signup.html">Sign Up</a>
        </p>
        <a href="index.html" class="back-link">← Back to Home</a>
      </div>
    </section>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;

          if (!email || !password || password.length < 6) {
            alert(
              "Please enter a valid email and password (at least 6 characters).",
            );
            return;
          }

          // For now: fake login success
          alert("Logged in successfully! Redirecting to profile...");
          window.location.href = "profile.html";
        });
    </script>
  </body>
</html>
