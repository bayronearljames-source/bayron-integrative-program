<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - EJ SpeedZone Motorparts</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-content">
        <h2 class="logo">EJ SpeedZone</h2>
        <nav class="nav-links">
          <a href="profile.html" class="nav-link">Back to Profile</a>
        </nav>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <h2>Settings</h2>
        <div class="settings-form">
          <form id="settingsForm">
            <label for="settingsEmail">Change Email</label>
            <input
              type="email"
              id="settingsEmail"
              placeholder="Enter new email"
            />
            <label for="settingsAddress">Change Address</label>
            <input
              type="text"
              id="settingsAddress"
              placeholder="Enter new address"
            />
            <label for="settingsPassword">Change Password</label>
            <input
              type="password"
              id="settingsPassword"
              placeholder="Enter new password"
            />
            <label for="theme">Theme</label>
            <select id="theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
            <button type="submit" class="cta-btn">Save Changes</button>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2026 SpeedZone Motorparts | Created by Earl James Bayron</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
