<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - EJ SpeedZone Motorparts</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container header-content">
        <a href="index.html" class="logo-link">
          <h2 class="logo">EJ SpeedZone</h2>
        </a>
        <nav class="nav-links">
          <a href="profile.html" class="nav-link">Back to Profile</a>
        </nav>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <h2>Account Settings</h2>

        <div class="settings-form">
          <form id="settingsForm" novalidate>
            <div class="form-group">
              <label for="settingsEmail">Change Email</label>
              <input
                type="email"
                id="settingsEmail"
                name="email"
                placeholder="Enter new email"
              />
            </div>

            <div class="form-group">
              <label for="settingsAddress">Change Address</label>
              <input
                type="text"
                id="settingsAddress"
                name="address"
                placeholder="Enter new address"
              />
            </div>

            <div class="form-group">
              <label for="settingsPassword">Change Password</label>
              <input
                type="password"
                id="settingsPassword"
                name="password"
                placeholder="Enter new password"
              />
            </div>

            <div class="form-group">
              <label for="theme">Theme</label>
              <select id="theme" name="theme">
                <option value="light">Light</option>
                <option value="dark" selected>Dark</option>
              </select>
            </div>

            <button type="submit" class="cta-btn">Save Changes</button>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>© 2026 SpeedZone Motorparts | Created by Earl James Bayron</p>
        <a href="index.html" class="back-link">← Back to Home</a>
      </div>
    </footer>

    <script>
      document
        .getElementById("settingsForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Mimic a save (no real backend yet)
          alert("Settings saved successfully!");
        });
    </script>
  </body>
</html>
